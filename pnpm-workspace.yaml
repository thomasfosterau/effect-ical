# Every external version lives here (`catalogMode: strict`); package.json
# references only `catalog:` and `catalog:peers`. After editing, run
# `vp install` and commit pnpm-lock.yaml.
catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch` (the `prepare` script) supports only the TypeScript,
  # oxlint and tsgolint versions in the `components` table of
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs, and fails `pnpm install`
  # on any other. Moves with `@typescript/native` and `vite-plus`.
  "@effect/tsgo": 0.63.0
  "@enfect/oxlint": ^0.10.0
  "@thomasfosterau/effect-parse": ^0.5.0
  "@types/node": ^26.6.6
  # Must equal the vitest that vite-plus bundles.
  "@vitest/coverage-istanbul": 5.0.5
  effect: 4.1.2
  fallow: 3.43.2
  # TypeScript 6/7 side by side: JS-API consumers (the language service,
  # `vp pack`'s declaration bundler) need TS6 as `typescript` (bin `tsc6`);
  # `@typescript/native` is TS7 (bin `tsc`), patched by @effect/tsgo.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins oxlint, oxfmt and vitest exactly; `vite` and `vitest` must
  # match it.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Peer ranges of the published package. Raise `effect` only when a dependency
# requires a newer one.
catalogs:
  peers:
    "@thomasfosterau/effect-parse": ^0.5.0
    effect: ^4.0.0

overrides:
  # `effect` must be a singleton: two copies break Context / Schema identity.
  effect: "catalog:"
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

# vitest peers on `vite` by version, which the aliased vite-plus-core package
# cannot satisfy by name.
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
  msgpackr-extract: false

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
