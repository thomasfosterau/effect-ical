# Dependabot version updates for the npm dependencies (pnpm maintains
# `pnpm-lock.yaml`; Dependabot regenerates it in the same PR as the bump) and
# the SHA-pinned GitHub Actions (Dependabot keeps the SHA and its `# vX.Y.Z`
# comment current together).
#
# `groups` collect dependencies that MUST move together into one PR. A
# dependency joins the FIRST group whose patterns match it, so the groups run
# from specific to general:
#
# - `toolchain`: vite-plus with the `vite` / `vitest` / `@vitest/*` /
#   `oxlint` / `oxfmt` / `oxlint-tsgolint` versions it pins exactly, the
#   TypeScript 6/7 pair (`typescript` is an alias of
#   `@typescript/typescript6`, `@typescript/native` of `typescript@7`),
#   `@effect/tsgo` (whose `effect-tsgo patch` hard-errors on any TypeScript /
#   oxlint pairing it ships no artifact for, failing `pnpm install`) and the
#   Effect oxlint plugin `@enfect/oxlint`. Read the catalog comments in
#   pnpm-workspace.yaml before merging one of these.
# - `effect`: `effect` + `@effect/*` (the Effect line moves as one), except
#   `@effect/tsgo`, which belongs to the toolchain.
# - `changesets`, `fallow`: one PR each.
# - `npm-minor-and-patch`: everything else, minor and patch only, so a major
#   bump of an ungrouped dependency arrives on its own.
#
# Hand moves Dependabot cannot make (do them on the toolchain PR's branch):
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core`,
#   must equal `vite-plus`), `typescript` (`npm:@typescript/typescript6`) and
#   `@typescript/native` (`npm:typescript`, must match `@effect/tsgo`'s
#   `components` table);
# - `@effect/tsgo` itself when the new vite-plus carries an oxlint /
#   oxlint-tsgolint the pinned release does not list;
# - the `vite@*` / `vitest@*` / `effect` overrides follow their catalog
#   entries and need no edit of their own.
#
# `cooldown` is 1 day, the shortest Dependabot allows (whole days only). That
# is longer than pnpm-workspace.yaml's `minimumReleaseAge` (480 minutes, 8
# hours), so Dependabot never proposes a version pnpm's supply-chain gate
# would still reject at install time; `@thomasfosterau/*` is exempt there and
# here. Cooldown applies only to version updates: security updates open at
# once.
version: 2
updates:
  - package-ecosystem: "npm" # covers the pnpm-lock.yaml lockfile
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@oxlint/*"
          - "@enfect/oxlint"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
