name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]
  workflow_dispatch:

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-ical' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "*"
          check-latest: true
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "*"
          check-latest: true
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on the owner's behalf).
    # Nor for a Dependabot actor: the job holds `id-token: write` and a
    # write token, and only the owner's merge to `trunk` (or a dispatch)
    # should reach it.
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # mint the OIDC token npm exchanges for publish creds
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` it compares node_modules with the manifests and, if a
      # manifest looks newer than the last install, re-installs WITH lifecycle
      # scripts, undoing the `--ignore-scripts` below inside a job that holds
      # `id-token: write`. It triggers whenever a manifest's mtime moves after
      # the install step, e.g. when the Changesets action resets
      # `changeset-release/trunk`. pnpm 11 reads only the `pnpm_config_*`
      # spelling.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from `packageManager` in package.json. No
      # package cache in the publish job: a cache another workflow wrote must
      # never feed a job that holds `id-token: write` (zizmor's
      # `cache-poisoning`); a cold install is the price.
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          # Never `latest`: setup-node resolves it to the newest nodejs.org
          # index entry, pre-releases included (v27.0.0-alpha since 2026-10-29,
          # which hangs some test suites). `*` + `check-latest` takes the
          # newest stable release from setup-node's manifest instead.
          node-version: "*"
          check-latest: true
          registry-url: https://registry.npmjs.org
      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job. It also skips this repo's own
      # `prepare` (`vp config`'s git hooks and the `effect-tsgo` patch), which
      # neither `vp pack`, `changeset version` nor `vp fmt` needs.
      #
      # No check or test step: CI (ci.yml) runs every gate on each PR into
      # `trunk` and on each push to `trunk`, so this job runs only what
      # publishing needs. `changeset:publish` builds (`vp run build`) before
      # publishing, so a build break still stops the publish.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `changeset publish` runs `pnpm publish`; pnpm 11 publishes natively
      # and performs the trusted-publishing (OIDC) exchange itself, so the job
      # installs no npm CLI of its own and holds no NPM_TOKEN.
      - name: Create Release PR or publish
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
