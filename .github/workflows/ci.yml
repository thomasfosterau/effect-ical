name: CI

# One gate job, `ci`, running AGENTS.md's Verification gates in order. The
# task graph lives in vite.config.ts (`check`, `test:unit`, `test:coverage`,
# `build`), not in GitHub Actions `needs:`. Shaped like the effect-web
# library's ci.yml. Nothing here needs a database, a stage or a credential.
#
# The default branch is `trunk` (not `main`); the triggers must say so or the
# workflow never fires.
#
# Every third-party action is pinned to a full commit SHA (the tag is a comment
# for humans; Dependabot's `github-actions` ecosystem keeps both current).

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      - name: Format and lint
        run: vp check
      # Native TS7 type-check (`tsc`, patched by @effect/tsgo on install) of
      # `src`, then of `src`, `tests` and `examples`.
      - name: Type gate
        run: vp run check
      - name: Unit tests
        run: vp run test:unit
      # The suite again under Istanbul, failing if `src/` coverage drops below
      # the thresholds in vite.config.ts.
      - name: Coverage thresholds
        run: vp run test:coverage
      - name: Build
        run: vp run build
      - name: Audit
        run: pnpm audit --audit-level high
