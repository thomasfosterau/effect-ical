# Composite setup shared by the CI job: Node.js + pnpm, the pnpm store cache
# (keyed on pnpm-lock.yaml by setup-node) and a frozen-lockfile install
# (retried, see the Install step). `vp` and the dev bins (tsc, fallow) land in
# node_modules/.bin; callers run them as `pnpm exec vp …` (nothing is written
# to $GITHUB_PATH, which zizmor's `github-env` audit flags). Copied from the
# effect-web library's action.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Node.js and pnpm, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # Never `latest`: setup-node resolves it to the newest nodejs.org
        # index entry, pre-releases included (v27.0.0-alpha since 2026-10-29,
        # which hangs some test suites). `*` + `check-latest` takes the
        # newest stable release from setup-node's manifest instead.
        node-version: "*"
        check-latest: true
        cache: pnpm

    # Retried: pnpm's linker can race itself when a package with a build
    # script resolves twice and both copies build (a transient ENOENT on a
    # `_tmp_<pid>_<hex>` rename, seen in the family's CI on cold-store runs).
    # Every attempt keeps `--frozen-lockfile` and install scripts, so a
    # deterministic failure (lockfile drift, a policy violation) still fails
    # all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
